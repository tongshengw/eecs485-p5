<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ask485</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="feed">
      <div class="ask485">ask485</div>
      <form action="/" method="GET" class="search_bar">
        <input type="text" name="q" value="{{ query }}" />
        <div class="pagerank_weight">PageRank Weight</div>
        <input
          type="range"
          name="w"
          min="0"
          max="1"
          step="0.01"
          value="{{ weight }}"
        />
        <input type="submit" value="Search" />
      </form>
      {% if results %}
      <div class="docs">
        {% for result in results %}
        <div class="doc">
          <a class="doc_url" href="{{ result.url_encoded }}"
            >{{ result.url_decoded }}</a
          >
          <div class="doc_title">{{ result.title }}</div>
          <div class="doc_summary">{{ result.summary }}</div>
        </div>
        {% endfor %}
      </div>
      {% elif query %}
      <div class="no_results">No search results found!</div>
      {% endif %}
    </div>
  </body>
</html>
